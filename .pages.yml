media:
  input: public
  output: /
content:
  - name: index
    label: Homepage
    type: file
    path: src/content/index_page.json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: string, options: { maxlength: 200 } }
      - { name: landing, component: landing }
      - name: sections
        label: Sections
        type: block
        blockKey: type
        list: true
        blocks:
          - name: text_section
            label: Text Section
            component: section
          - name: cards_section
            label: Cards Section
            fields:
              - name: cards
                label: Cards
                component: card
                list: true
          - name: bento_section
            label: Bento Section
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: text, label: Text, type: text, required: true }
              - { name: images, label: Images, type: image, list: { max: 2 } }
              - { name: imageAlt, label: Image description, type: string }
              - name: gallery
                label: Photo gallery
                type: object
                list: true
                fields:
                  - { name: src, label: Photo, type: image, required: true }
                  - { name: alt, label: Description, type: string, required: true }
                  - { name: position, label: Crop position, type: string }
                  - { name: fit, label: Image fit, type: select, options: { values: [cover, contain] } }

      - name: statistics
        label: Statistics
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: value
            label: Value
            type: string
  - name: footer
    label: Footer
    type: file
    path: src/content/footer.json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: body, label: Body, type: rich-text, options: { format: markdown } }
      - { name: social_links, label: Social Links, component: social_link, list: true }
  - name: navbar
    label: Navbar
    type: file
    path: src/content/navbar.json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: links, label: Links, component: link, list: true }
  - name: sponsors_page
    label: Sponsors page
    type: file
    path: src/content/sponsors_page.json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: string, options: { maxlength: 200 } }
      - name: sections
        label: Sections
        type: block
        blockKey: type
        list: true
        blocks:
          - name: text_section
            label: Text Section
            component: section
          - name: cards_section
            label: Cards Section
            fields:
              - name: cards
                label: Cards
                component: card
                list: true
  - name: projects_page
    label: Projects page
    type: file
    path: src/content/projects_page.json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Introduction, type: text, required: true }
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - { name: tag, label: Category, type: string, required: true }
          - { name: title, label: Title, type: string, required: true }
          - { name: tagline, label: Summary, type: text, required: true }
          - { name: description, label: Description, type: text, required: true }
          - name: image
            label: Mission patch
            type: object
            required: true
            fields:
              - { name: src, label: Image, type: image, required: true }
              - { name: alt, label: Alternative text, type: string, required: true }
              - { name: width, label: Width, type: number, required: true, options: { min: 1 } }
              - { name: height, label: Height, type: number, required: true, options: { min: 1 } }
          - name: roles
            label: Available roles
            type: object
            required: true
            list: { min: 1 }
            fields:
              - { name: title, label: Role, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: positions, label: Positions, type: number, required: true, options: { min: 1 } }
          - { name: applicationUrl, label: Application URL, type: string, required: true }
          - { name: applicationLabel, label: Application button, type: string, required: true }
          - { name: applicationNote, label: Application note, type: text, required: true }
  - name: departments_page
    label: Departments page
    type: file
    path: src/content/departments_page.json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: string, options: { maxlength: 200 } }
      - name: sections
        label: Sections
        type: block
        blockKey: type
        list: true
        blocks:
          - name: text_section
            label: Text Section
            component: section
          - name: cards_section
            label: Cards Section
            fields:
              - name: cards
                label: Cards
                component: card
                list: true
  - name: contacts_page
    label: Contacts page
    type: file
    path: src/content/contacts_page.json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: string, options: { maxlength: 200 } }
      - { name: email, label: Email, type: string, required: true }
      - name: sections
        label: Sections
        type: block
        blockKey: type
        list: true
        blocks:
          - name: text_section
            label: Text Section
            component: section
          - name: cards_section
            label: Cards Section
            fields:
              - name: cards
                label: Cards
                component: card
                list: true
  - name: team_page
    label: Team page
    type: file
    path: src/content/team_page.json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: string, options: { maxlength: 160 } }
      - name: banner
        label: Banner
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: description, label: Description, type: string }
          - { name: backgroundImage, label: Background Image, type: image }
      - name: board
        label: Board
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - name: members
            label: Members
            component: member
            list: true
      - name: departments
        label: Departments
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - name: members
            label: Members
            component: member
            list: true
  - name: sponsors
    label: Sponsors List
    type: file
    path: src/content/sponsors.json
    fields:
      - { name: sponsors, label: Sponsors, component: sponsor, list: true }
  - name: faq
    label: FAQ
    type: file
    path: src/content/faq.json
    fields:
      - { name: faq, label: FAQ, component: question, list: true }
components:
  landing:
    label: Landing Section
    fields:
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Subtitle
        type: text
      - name: buttons
        label: Buttons
        component: button
        list:
          min: 1
          max: 2
  section:
    label: Section
    fields:
      - name: title
        label: Section title
        type: string
      - name: body
        label: Section content
        type: rich-text
        options: { format: markdown }
  social_link:
    label: Social Link
    fields:
      - name: name
        label: Name
        type: string
      - name: url
        label: Url
        type: string
      - name: icon
        label: Social Icon
        type: image
  button:
    label: Button
    fields:
      - name: title
        label: Title
        type: string
      - name: url
        label: Url
        type: string
      - name: primary
        label: Primary
        type: boolean
        default: false
  link:
    label: Link
    fields:
      - name: title
        label: Title
        type: string
      - name: url
        label: Url
        type: string
  card:
    label: Card
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Body
        type: rich-text
        options: { format: markdown }
      - name: button
        label: Button
        component: button
  sponsor:
    label: Sponsor
    fields:
      - name: name
        label: Name
        type: string
      - name: image
        label: Logo
        type: image
      - name: url
        label: Url
        type: string
      - name: description
        label: description
        type: string
      - { name: logoBackground, label: Logo background, type: select, options: { values: [light] } }
      - { name: logoFit, label: Logo fit, type: select, options: { values: [contain, cover] } }
      - { name: logoWidth, label: Logo width (px), type: number }
      - { name: logoHeight, label: Logo height (px), type: number }
      - { name: scale, label: Logo scale, type: string }
  question:
    label: Question
    fields:
      - name: question
        label: Question
        type: string
      - name: answer
        label: Answer
        type: text
  member:
    label: Member
    fields:
      - { name: firstName, label: First Name, type: string }
      - { name: lastName, label: Last Name, type: string }
      - { name: role, label: Role, type: string }
      - { name: linkedin, label: Linkedin, type: string }
      - { name: imgAvail, label: Image Available, type: boolean, default: false }
      - { name: imgSrc, label: Image, type: image }
      - { name: isHead, label: Is Head, type: boolean, default: false }
      - { name: boardRole, label: Board Role, type: string }
